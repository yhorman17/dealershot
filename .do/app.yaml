name: dealershot
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains:
  - domain: dealershot.studiogecko.dev
    type: PRIMARY
    minimum_tls_version: "1.2"

services:
  - name: web
    github:
      repo: yhorman17/dealershot
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        type: GENERAL
        value: production
      - key: HOST
        scope: RUN_TIME
        type: GENERAL
        value: 0.0.0.0
      - key: PORT
        scope: RUN_TIME
        type: GENERAL
        value: "8080"
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 3
      failure_threshold: 3

ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
