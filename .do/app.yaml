name: dealershot
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains:
  - domain: dealershot.studiogecko.dev
    type: PRIMARY
    minimum_tls_version: "1.2"

services:
  - name: dealershot
    github:
      repo: yhorman17/dealershot
      branch: feature/retail-ready-configuration-acceptance
      deploy_on_push: false
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        type: GENERAL
        value: production
      - key: HOST
        scope: RUN_TIME
        type: GENERAL
        value: 0.0.0.0
      - key: PORT
        scope: RUN_TIME
        type: GENERAL
        value: "8080"
      - key: DEPLOYED_COMMIT_SHA
        scope: RUN_TIME
        type: GENERAL
        value: ${_self.COMMIT_HASH}
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 3
      failure_threshold: 3

workers:
  - name: background-worker
    github:
      repo: yhorman17/dealershot
      branch: feature/retail-ready-configuration-acceptance
      deploy_on_push: false
    dockerfile_path: Dockerfile
    source_dir: /
    run_command: node .worker/index.mjs
    instance_count: 1
    # ISNet's production inference path peaks below 1 GiB but above 512 MiB.
    # Keep this aligned with scripts/verify-background-removal-worker-runtime.mjs.
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        type: GENERAL
        value: production
      - key: WORKER_POLL_INTERVAL_MS
        scope: RUN_TIME
        type: GENERAL
        value: "2000"
      - key: WORKER_LEASE_SECONDS
        scope: RUN_TIME
        type: GENERAL
        value: "60"
      - key: WORKER_METRICS_INTERVAL_MS
        scope: RUN_TIME
        type: GENERAL
        value: "60000"
      - key: VEHICLE_SEGMENTATION_V3
        scope: RUN_TIME
        type: GENERAL
        value: "1"
      - key: DEPLOYED_COMMIT_SHA
        scope: RUN_TIME
        type: GENERAL
        value: ${_self.COMMIT_HASH}

ingress:
  rules:
    - component:
        name: dealershot
      match:
        path:
          prefix: /
